name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Release publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm ci

      - name: Publish
        run: |
          set +e
          npm publish --provenance --access public --loglevel verbose 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E 'oidc|npm error|http fetch' publish.log | head -20 | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $code
